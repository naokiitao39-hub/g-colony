<title>ゴキ鉄 魔王城建国記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mochiy+Pop+One&display=swap">
<style>
/* Layout: one-screen phone sugoroku — cream HUD card / bright Japan map / candy action buttons. Single bright look (picture-book board game). */
:root{
  --ink:#3b2412; --cream:#fffaf0; --paper:#fff1cf; --line:#e3cfa3; --dim:#8a6d4b;
  --sea:#3fa7e8; --sea2:#2a83cf; --red:#ff5a4e; --blue:#3d8bff; --yellow:#ffcc33; --green:#4fbf55; --pink:#ff7eb6; --orange:#ff9a1f;
  --you:#ff9a1f; --rat:#4f8ff0; --ter:#ec5fae; --hum:#9aa3ab;
  --pop:"Mochiy Pop One","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--sea2);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:none;margin:0 auto;display:flex;flex-direction:column;position:relative}
#hud{margin:8px 8px 0;padding:7px 12px 8px;display:grid;gap:3px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(30,20,10,.35);font-variant-numeric:tabular-nums;position:relative;z-index:2}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
#date{font-family:var(--pop);font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.kessan{font-size:12px;background:#fff1c4;border:2px solid var(--ink);border-radius:10px;padding:1px 7px;color:#b5520a}
.season{font-family:var(--pop);font-size:12px;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);color:#fff}
.s-spring{background:#ff8fbf}.s-summer{background:#3cc46a}.s-autumn{background:#ff8a2a}.s-winter{background:#5ab6ff}
#goal{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#goal b{font-family:var(--pop);font-weight:400;color:#e8392c;font-size:16px;margin:0 2px}
.stats{font-size:12px;justify-content:flex-start;flex-wrap:wrap;column-gap:12px;row-gap:2px}
.stats b{color:var(--dim);font-weight:700;margin-right:4px}
.stats span{font-family:var(--pop);font-size:14px}
#gyBadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#ffe2de;color:#c0281c;border:2px solid #c0281c}
#turnChip{font-family:var(--pop);font-size:12.5px;padding:3px 11px;border-radius:999px;border:2px solid var(--ink);color:#fff;background:var(--hum);white-space:nowrap}
#stage{flex:1;position:relative;min-height:0;margin-top:-10px}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toasts{position:absolute;left:10px;right:10px;top:16px;display:grid;gap:4px;pointer-events:none;z-index:3}
.toast{justify-self:center;max-width:100%;background:var(--cream);border:2.5px solid var(--ink);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25);animation:tin .2s ease-out}
.toast.good{background:#fff3b8}.toast.danger{background:#ffe0dc;color:#b3261b}
@keyframes tin{from{opacity:0;transform:translateY(-4px)}}
#bHere{position:absolute;right:10px;top:18px;z-index:2;font-family:var(--pop);font-size:12px;padding:6px 11px;border-radius:999px;border:2.5px solid var(--ink);background:var(--cream);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#msg{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:12px 14px 14px;min-height:84px;font-family:var(--pop);font-size:15.5px;line-height:1.65;color:var(--ink);box-shadow:0 5px 0 rgba(30,20,10,.35)}
#msg.face{padding-left:92px}
#msgFace{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:76px;height:76px;border-radius:16px;background:#ffe9b3;border:2.5px solid var(--ink)}
#msgName{position:absolute;left:14px;top:-15px;font-family:var(--pop);font-size:12px;padding:2px 10px;border-radius:999px;border:2.5px solid var(--ink);color:#fff;background:var(--hum)}
#msgText{white-space:pre-wrap;min-height:1.6em}
#msgBtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#msgBtns button{font-family:var(--pop);font-size:15px;padding:8px 16px;border-radius:999px;border:2.5px solid var(--ink);background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
#msgNext{position:absolute;right:16px;bottom:6px;font-size:14px;color:#e8392c;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#destBar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:10px 10px 12px;background:linear-gradient(transparent,rgba(20,60,110,.55) 35%)}
#destBar .lbl{flex:none;align-self:center;font-family:var(--pop);font-size:13px;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 4px var(--ink)}
.dest{flex:none;font-family:var(--pop);font-size:13px;padding:7px 12px;border-radius:999px;border:2.5px solid var(--ink);background:var(--cream);color:var(--ink);display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--ink)}
.dest i{width:12px;height:12px;border-radius:4px;display:inline-block;border:2px solid var(--ink)}
.dest.survey{background:#fff3c4}.dest.survey.on{background:#ffd23f}
.dest small{font-family:var(--body);font-weight:700;color:var(--dim);font-size:11px}
.dest.best{background:#fff3b8}
#dice{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:5;display:flex;gap:10px;pointer-events:none}
.die-old{width:60px;height:60px;border-radius:14px;background:#fff;color:var(--ink);font-family:var(--pop);font-size:32px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);animation:roll .12s linear}
.die-old.red{color:#e8392c}
#dice{perspective:700px;gap:26px}
.dwrap{position:relative;width:68px;height:68px;animation:dthrow 1s cubic-bezier(.25,.7,.35,1) both}
.dwrap:nth-child(2){animation-delay:.06s}.dwrap:nth-child(3){animation-delay:.12s}.dwrap:nth-child(4){animation-delay:.18s}
@keyframes dthrow{0%{transform:translate(-140px,190px) scale(.55)}50%{transform:translate(0,-46px) scale(1.12)}70%{transform:translate(0,0) scale(1)}82%{transform:translateY(-14px)}92%{transform:translateY(0)}100%{transform:none}}
.cube{width:68px;height:68px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.18,.75,.25,1)}
.cube.land{animation:dland .35s ease-out}
@keyframes dland{40%{scale:1.18}}
.dface{position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,#fff,#fff6e4 70%,#f1e2c4);border:3px solid var(--ink);border-radius:16px;backface-visibility:hidden;box-shadow:inset 0 -5px 0 rgba(120,80,30,.15)}
.df1{transform:translateZ(34px)}.df6{transform:rotateY(180deg) translateZ(34px)}.df3{transform:rotateY(90deg) translateZ(34px)}.df4{transform:rotateY(-90deg) translateZ(34px)}.df5{transform:rotateX(90deg) translateZ(34px)}.df2{transform:rotateX(-90deg) translateZ(34px)}
.pip{position:absolute;width:19px;height:19px;margin:-9.5px 0 0 -9.5px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%233b1a08%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M17%209%20C13%203%209%202%205%203%22/%3E%3Cpath%20d%3D%22M23%209%20C27%203%2031%202%2035%203%22/%3E%3Cpath%20d%3D%22M13%2018%20L6%2015%20M13%2023%20L5%2024%20M14%2028%20L7%2033%20M27%2018%20L34%2015%20M27%2023%20L35%2024%20M26%2028%20L33%2033%22/%3E%3C/g%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2224%22%20rx%3D%228.5%22%20ry%3D%2212%22%20fill%3D%22%237a3a12%22%20stroke%3D%22%233b1a08%22%20stroke-width%3D%221.6%22/%3E%3Cpath%20d%3D%22M20%2015%20V35%22%20stroke%3D%22%233b1a08%22%20stroke-width%3D%221.2%22%20opacity%3D%22.55%22/%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2211%22%20rx%3D%225.5%22%20ry%3D%224.2%22%20fill%3D%22%233b1a08%22/%3E%3Cellipse%20cx%3D%2217%22%20cy%3D%2219%22%20rx%3D%222.2%22%20ry%3D%224%22%20fill%3D%22%23fff%22%20opacity%3D%22.35%22/%3E%3C/svg%3E") center/contain no-repeat}
.pip.one{width:40px;height:40px;margin:-20px 0 0 -20px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%237a1208%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M17%209%20C13%203%209%202%205%203%22/%3E%3Cpath%20d%3D%22M23%209%20C27%203%2031%202%2035%203%22/%3E%3Cpath%20d%3D%22M13%2018%20L6%2015%20M13%2023%20L5%2024%20M14%2028%20L7%2033%20M27%2018%20L34%2015%20M27%2023%20L35%2024%20M26%2028%20L33%2033%22/%3E%3C/g%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2224%22%20rx%3D%228.5%22%20ry%3D%2212%22%20fill%3D%22%23e8392c%22%20stroke%3D%22%237a1208%22%20stroke-width%3D%221.6%22/%3E%3Cpath%20d%3D%22M20%2015%20V35%22%20stroke%3D%22%237a1208%22%20stroke-width%3D%221.2%22%20opacity%3D%22.55%22/%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2211%22%20rx%3D%225.5%22%20ry%3D%224.2%22%20fill%3D%22%237a1208%22/%3E%3Cellipse%20cx%3D%2217%22%20cy%3D%2219%22%20rx%3D%222.2%22%20ry%3D%224%22%20fill%3D%22%23fff%22%20opacity%3D%22.35%22/%3E%3C/svg%3E")}
.dshadow{position:absolute;left:8px;right:8px;bottom:-14px;height:10px;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(2px)}
@keyframes roll{50%{transform:rotate(14deg) scale(1.08)}}
#diceSum{position:absolute;left:50%;top:calc(40% + 72px);transform:translateX(-50%);z-index:5;font-family:var(--pop);font-size:22px;color:#fff;background:var(--red);border:3px solid var(--ink);border-radius:999px;padding:2px 18px;box-shadow:0 4px 0 var(--ink);text-shadow:0 3px 0 var(--ink),0 0 6px var(--ink);pointer-events:none}
#bar{flex:none;display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:7px;padding:8px 8px 10px;background:linear-gradient(#2a83cf,#1f6db5)}
#bar button{font-family:var(--pop);font-size:13.5px;white-space:nowrap;padding:0 4px;min-height:52px;border-radius:16px;border:3px solid var(--ink);color:var(--ink);box-shadow:0 4px 0 var(--ink);background:var(--cream)}
#bar button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#bar #bDice{background:linear-gradient(#ff7a5e,#ff4a3a);color:#fff;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#bar #bCard{background:var(--yellow)}#bar #bStation{background:#8fe08a}#bar #bRank{background:#9cc8ff}#bar #bMenu{background:#ffc7e0}
#bar button:disabled{opacity:.45;box-shadow:0 2px 0 var(--ink)}
button{cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ov{position:absolute;inset:0;background:linear-gradient(#7fd0ff,#3fa7e8 55%,#2a83cf);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 16px;gap:14px;z-index:10;overflow-y:auto;text-align:center}
.ov.dim{background:rgba(20,50,90,.75)}
.ov h1{font-family:var(--pop);font-weight:400;font-size:72px;line-height:1;margin:0;color:#ffcc33;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:4px;transform:rotate(-3deg)}
.ov h2{font-family:var(--pop);font-weight:400;font-size:22px;margin:0;color:#fff;text-shadow:0 3px 0 var(--ink);text-wrap:balance}
.ov p{margin:0;color:var(--ink);font-size:13.5px;line-height:1.75;max-width:30em;background:var(--cream);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:700}
.ov .plain{background:none;border:none;padding:0;color:#fff;text-shadow:0 2px 0 var(--ink)}
.sub{font-family:var(--pop);color:#fff;font-size:17px;letter-spacing:4px;text-shadow:0 3px 0 var(--ink)}
#titleArt{width:min(340px,90%);height:150px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.big{font-family:var(--pop);font-size:18px;padding:12px 24px;border-radius:999px;border:3px solid var(--ink);background:linear-gradient(#ff7a5e,#ff4a3a);color:#fff;min-width:160px;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.big.ghost{background:var(--cream);color:var(--ink);text-shadow:none}
.big.small{font-size:14px;padding:9px 16px;min-width:0;box-shadow:0 4px 0 var(--ink)}
.big:disabled{opacity:.45}
.opts{display:grid;gap:12px;width:100%;max-width:380px;text-align:left;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:14px}
.opt{display:grid;gap:6px}.opt>span{font-size:12.5px;font-weight:700;color:var(--dim)}
.seg{display:flex;gap:6px}
.seg button{flex:1;font-family:var(--pop);font-size:14px;padding:9px 4px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.seg button.on{background:var(--yellow)}
.seg small{display:block;font-family:var(--body);font-weight:700;font-size:10.5px;color:var(--dim)}
textarea.pw{width:100%;max-width:380px;min-height:130px;resize:none;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:12px;font-family:var(--pop);font-size:17px;line-height:1.6;letter-spacing:2px;text-align:center;-webkit-user-select:text;user-select:text}
.err{color:#fff;background:#e8392c;border-radius:8px;padding:0 8px;font-size:13px;min-height:1.2em;font-weight:700}
.err:empty{background:none}
.note{font-size:12px;color:var(--dim);font-weight:700}
.ov .note{color:#fff;text-shadow:0 1px 0 var(--ink)}
#panel{position:absolute;inset:0;z-index:8;background:rgba(20,40,70,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86%;display:flex;flex-direction:column;background:var(--cream);border:3px solid var(--ink);border-bottom:none;border-radius:22px 22px 0 0;overflow:hidden}
.sheet header{padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:linear-gradient(#ffd75e,#ffbf2e);border-bottom:3px solid var(--ink)}
.sheet header h3{margin:0;font-family:var(--pop);font-weight:400;font-size:20px}
.sheet header small{color:var(--ink);font-size:12px;font-weight:700}
#pBody{overflow-y:auto;padding:10px 12px;display:grid;gap:8px}
.sheet footer{padding:10px 12px 14px;display:flex;gap:8px;justify-content:flex-end;border-top:2px dashed var(--line);flex-wrap:wrap}
#pArt{display:block;margin:0 auto;width:120px;height:108px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:9px 10px;border-left-width:9px}
.prow .pn{font-family:var(--pop);font-size:15px;min-width:0;grid-column:1}
.prow .pd{grid-column:1;line-height:1.5;font-size:11.5px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.prow button{grid-row:1/3;grid-column:2;font-family:var(--pop);font-size:13.5px;padding:8px 10px;border-radius:999px;border:2.5px solid var(--ink);background:var(--yellow);color:var(--ink);min-width:88px;box-shadow:0 3px 0 var(--ink)}
.prow button.take{background:#ff8a7a}
.stnHead{font-family:var(--pop);font-size:15px;margin:12px 4px 4px;color:var(--ink);cursor:pointer}.stnHead small{font-size:12px;color:var(--dim)}
.debt{background:#fff1ee;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13.5px;line-height:1.6}.debt small{color:var(--dim)}.neg{color:#d8352a}
.prow button:disabled{background:#eee;color:#999;box-shadow:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}
.tbl th,.tbl td{padding:7px 6px;border-bottom:2px dashed var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--dim);font-size:11.5px}
.tbl .nm{font-family:var(--pop);font-weight:400;font-size:14px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;background:linear-gradient(#fffbe6,#fff2b0);border:2.5px solid var(--ink);border-radius:14px;padding:9px 10px}
.card .cn{font-family:var(--pop);font-size:15px;color:#c0501c}
.card .cd{font-size:11.5px;font-weight:700;color:var(--dim)}
.card button{grid-row:1/3;grid-column:2;font-family:var(--pop);font-size:14px;padding:8px 14px;border-radius:999px;border:2.5px solid var(--ink);background:#ff7a5e;color:#fff;box-shadow:0 3px 0 var(--ink)}
.card button:disabled{background:#eee;color:#999;box-shadow:none}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:middle;border:2px solid var(--ink)}
#movie{position:absolute;inset:0;z-index:20;background:#000;display:flex}
#movie canvas{width:100%;height:100%;display:block}
#skip{position:absolute;right:12px;bottom:14px;font-family:var(--pop);font-size:13px;padding:7px 14px;border-radius:999px;border:2px solid #fff;background:rgba(0,0,0,.5);color:#fff;z-index:21}
#roll{position:absolute;left:0;right:0;top:100%;display:grid;gap:22px;padding:0 16px;text-align:center;animation:credroll 40s linear forwards}
#roll .h{font-family:var(--pop);font-size:32px;color:#ffcc33;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#roll .c{font-family:var(--pop);font-size:15px;color:#fff;line-height:1.9;text-shadow:0 2px 0 var(--ink)}
#roll .c span{display:block;color:#ffe9a8;font-size:11px;letter-spacing:3px}
@keyframes credroll{to{transform:translateY(calc(-100% - 100vh))}}
#credits{position:absolute;inset:0;z-index:22;background:linear-gradient(#1f5fa8,#0f2f5c);overflow:hidden}
#credEnd{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center}
@media (min-width:700px){#bar button{min-height:60px;font-size:16px}#bar #bDice{font-size:22px}#date{font-size:20px}.stats{font-size:14px}.stats span{font-size:17px}#msg{font-size:18px;left:18%;right:18%}}
@media (min-width:700px) and (min-height:600px){
  .sheet{max-width:720px}.prow{padding:12px 14px}.prow .pn{font-size:18px}.prow .pd{font-size:14px}.prow button{font-size:16px;min-width:120px;padding:10px 14px}
  .debt{font-size:16px}.note{font-size:14px}#pTitle{font-size:26px}.tbl{font-size:16px}html .how .ht{font-size:15px}html .how .hh{font-size:18px}
  #msg{font-size:20px}#goal{font-size:16px}.kessan{font-size:14px}.toast{font-size:16px}.dest{font-size:16px}}
@media (min-width:1000px) and (min-height:700px){#msg{left:22%;right:22%;font-size:21px}#bar button{min-height:66px;font-size:18px}#bar #bDice{font-size:26px}#date{font-size:23px}.stats{font-size:15px}.stats span{font-size:19px}}
@media (prefers-reduced-motion:reduce){.toast,.dwrap,.cube.land{animation:none}.cube{transition:none}#msgNext{animation:none}#roll{animation-duration:70s}}
#fxov{position:absolute;inset:0;z-index:15;background:#000}
#fxov canvas{width:100%;height:100%;display:block}
.pd .ow{white-space:nowrap}

const distCache=new Map();
function distFrom(src){if(distCache.has(src))return distCache.get(src);const d=new Int16Array(NODES.length).fill(-1),q=[src];d[src]=0;
  for(let qi=0;qi<q.length;qi++){const u=q[qi];for(const v of NODES[u].nb)if(d[v]<0){d[v]=d[u]+1;q.push(v);}}distCache.set(src,d);return d;}

// サイコロの目ちょうどで止まれるマス（同じ移動中に引き返し不可。目的地はぴったり止まったときだけ到着）
function reach(start,n,goalNode,wantPass){
  const occ=new Set(G.players.filter(q=>q!==cur).map(q=>q.node));
  let layer=new Map([[start+':-1',{node:start,prev:-1,par:null,pass:false}]]);const ends=new Map();
  for(let s=1;s<=n;s++){const nx=new Map();
    for(const st of layer.values()){for(const v of NODES[st.node].nb){if(v===st.prev&&NODES[st.node].nb.length>1)continue;
      const k=v+':'+st.node,pass=st.pass||occ.has(v),o={node:v,prev:st.node,par:st,pass};
      if(s===n){const e=ends.get(v);if(!e||(wantPass&&pass&&!e.pass))ends.set(v,o);continue;}
      const ex=nx.get(k);if(!ex||(wantPass&&pass&&!ex.pass))nx.set(k,o);}}
    layer=nx;}
  if(!ends.size)ends.set(start,{node:start,prev:-1,par:null,pass:false});
  return [...ends.values()].map(e=>{const path=[];let c=e;while(c&&c.par){path.push(c.node);c=c.par;}path.reverse();return {node:e.node,path,pass:e.pass};});
}

const KANA='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみ';
function keystream(n){let s=0x5A17C0DE>>>0;const o=new Array(n);for(let i=0;i<n;i++){s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;o[i]=s&1;}return o;}

function encodePW(){
  const b=[],w=(v,n)=>{v=Math.max(0,Math.min(2**n-1,Math.round(v)));for(let i=n-1;i>=0;i--)b.push(Math.floor(v/2**i)%2);};
  w(3,3);w(G.yi,2);w(G.lvl,2);w(G.year,6);w(G.month,4);w(G.turn,2);w(G.goal,7);w(G.prevGoal,7);
  for(const p of G.players){w(p.node,NB);w(p.money<0?1:0,1);w(Math.abs(p.money),36);w(p.cards.length,4);p.cards.forEach(c=>w(c,4));w(p.skip,2);w(p.goals,7);}
  w(G.gy.holder,2);w(G.gy.type,2);w(G.gy.months,5);w(G.gy.mega,1);
  const owned=[];for(let i=0;i<PROPS.length;i++)if(G.own[i])owned.push(i);const ib=Math.ceil(Math.log2(PROPS.length+1));
  if(owned.length*(ib+2)<PROPS.length*2){w(0,1);w(owned.length,ib);owned.forEach(i=>{w(i,ib);w(G.own[i],2);w(G.lv[i],2);});}
  else{w(1,1);for(let i=0;i<PROPS.length;i++)w(G.own[i],2);owned.forEach(i=>w(G.lv[i],2));}
  const crc=crc12(b),all=[];for(let i=11;i>=0;i--)all.push((crc>>i)&1);all.push(...b);while(all.length%5)all.push(0);
  const ks=keystream(all.length);let s='';for(let i=0;i<all.length;i+=5){let v=0;for(let j=0;j<5;j++)v=v*2+(all[i+j]^ks[i+j]);s+=KANA[v];}

function decodePW(str){
  const s=str.replace(/[\s　]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  if(!s)throw 'じゅもんを入れてください';
  const bits=[];for(const ch of s){const v=KANA.indexOf(ch);if(v<0)throw `「${ch}」はじゅもんに使われない文字です`;for(let j=4;j>=0;j--)bits.push((v>>j)&1);}
  const ks=keystream(bits.length);for(let i=0;i<bits.length;i++)bits[i]^=ks[i];
  let p=0;const r=n=>{let v=0;for(let i=0;i<n;i++){if(p>=bits.length)throw 'じゅもんが違います（文字が足りません）';v=v*2+bits[p++];}return v;};
  const crc=r(12),ver=r(3);if(ver<1||ver>3)throw 'じゅもんが違います';
  const o={yi:r(2),lvl:r(2),year:r(6),month:r(4),turn:r(2),goal:r(7),prevGoal:r(7),players:[]};
  for(let k=0;k<3;k++){const node=r(NB),neg=r(1),m=r(ver>=3?36:28),n=r(4),cards=[];for(let j=0;j<n;j++)cards.push(r(4));o.players.push({node,money:neg?-m:m,cards,skip:r(2),goals:r(7)});}
  o.gy={holder:r(2),type:r(2),months:r(5),mega:r(1)};
  const ib=Math.ceil(Math.log2(PROPS.length+1)),own=new Uint8Array(PROPS.length),lv=new Uint8Array(PROPS.length);
  if(r(1)===0){const n=r(ib);for(let j=0;j<n;j++){const i=r(ib),v=r(2);if(i>=PROPS.length)throw 'じゅもんが違います';own[i]=v;if(ver>=2)lv[i]=r(2);}}
  else{for(let i=0;i<PROPS.length;i++)own[i]=r(2);if(ver>=2)for(let i=0;i<PROPS.length;i++)if(own[i])lv[i]=r(2);}
  if(crc12(bits.slice(12,p))!==crc||bits.length-p>=5||bits.slice(p).some(x=>x))throw 'じゅもんが違います（どこかの文字が間違っています）';

  o.own=own;o.lv=lv;return o;
}

const ptr=new Map();let pinch0=null,downAt=null;

  if(ptr.size===2){const[a,b]=[...ptr.values()];pinch0={d:hyp(a.x-b.x,a.y-b.y),z:cam.tz};}});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(downAt&&hyp(e.clientX-downAt.x,e.clientY-downAt.y)>8)downAt.moved=true;
  if(ptr.size===2&&pinch0){const[a,b]=[...ptr.values()];cam.tz=clamp(pinch0.z*hyp(a.x-b.x,a.y-b.y)/pinch0.d,.25,2.4);cam.z=cam.tz;}
  else if(ptr.size===1&&downAt&&downAt.moved){cam.follow=false;cam.x-=dx/camZ();cam.y-=dy/camZ();}});
const pend=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch0=null;
  if(downAt&&!downAt.moved&&performance.now()-downAt.t<400&&ptr.size===0)tapAt(e.clientX,e.clientY);if(ptr.size===0)downAt=null;};

function tapAt(px,py){
  const r=cv.getBoundingClientRect(),wx=(px-r.left-cv.clientWidth/2)/camZ()+cam.x,wy=(py-r.top-cv.clientHeight/2)/camZ()+cam.y;
  let best=-1,bd=1e9;NODES.forEach((N,i)=>{const d=hyp(N.x-wx,N.y-wy);if(d<bd){bd=d;best=i;}});
  if(bd*camZ()>26*viewScale())return;

/* ---------- 全画面の演出（目的地到着・業者カットイン） ---------- */
function fxRun(draw,minT,maxT){
  if(TEST)return Promise.resolve();

    const f=()=>{if(done)return;const cw=c.clientWidth,ch=c.clientHeight,dpr=devicePixelRatio||1;

const LV=[{noise:6,res:.45},{noise:2.5,res:.3},{noise:.6,res:.22}];
function cpuPersona(p){return p.kind==='you'?'bal':p.persona;}
function chooseDest(p,opts){
  const L=LV[G.lvl],per=cpuPersona(p);
  let best=null,bs=-1e9;
  for(const o of opts){const N=NODES[o.node],d=stepsTo(o.node,G.goal);let s=-d*1.6;
    if(N.t==='s'&&N.st===G.goal)s+=120;
    if(N.t==='b')s+=season()==='夏'?6:3;if(N.t==='r')s-=season()==='冬'?7:4;if(N.t==='y')s+=p.cards.length<6?3.5:.5;
    if(N.t==='s'){const buy=STN[N.st].props.filter(i=>{const c=buyCost(i,p.id);return c!=null&&c<p.money*.6;}).length;s+=1.5+buy*(per==='ter'?2.2:1.4);}
    if(G.gy.holder===p.id&&o.pass)s+=14;
    if(G.gy.holder&&G.gy.holder!==p.id&&G.players.some(q=>q.id===G.gy.holder&&hyp(NODES[q.node].x-N.x,NODES[q.node].y-N.y)<1))s-=6;
    s+=rand(-L.noise,L.noise);if(s>bs){bs=s;best=o;}}

async function cpuCards(p){
  const d=stepsTo(p.node,G.goal),has=k=>p.cards.findIndex(c=>CARDS[c].k===k),per=cpuPersona(p),rivals=G.players.filter(q=>q!==p),top=rivals.slice().sort((a,b)=>assets(b)-assets(a))[0];
  let i;
  if(G.gy.holder===p.id&&(i=has('haoh'))>=0)return useCard(p,i);
  if(d>4){const dc=p.cards.map((c,k)=>({c,k})).filter(o=>CARDS[o.c].k==='dice').sort((a,b)=>CARDS[b.c].v-CARDS[a.c].v);
    if(dc.length){const want=d>16?dc[0]:dc[dc.length-1];return useCard(p,want.k);}}
  if(d>22&&(i=has('fly'))>=0&&Math.random()<.5)return useCard(p,i);
  if((i=has('breed'))>=0&&Math.random()<.6)return useCard(p,i);
  if((i=has('sticky'))>=0&&stepsTo(top.node,G.goal)<9&&Math.random()<.7)return useCard(p,i);
  if((i=has('raid'))>=0&&ownedBy(top.id).length&&Math.random()<(per==='rat'?.7:.4))return useCard(p,i);
  if((i=has('poison'))>=0&&Math.random()<(per==='rat'?.5:.3))return useCard(p,i);

async function cpuBuy(p,st){
